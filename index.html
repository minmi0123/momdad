<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>엄마 이야기</title>
<style>
  /* 밝게: 직장인 게임 2개(바탕 #1d1a22)와 반대로, 펼친 책 종이 느낌 */
  :root {
    --desk: #f3e3c3;   /* 책 바깥 */
    --paper: #fff8ea;  /* 책 종이 */
    --edge: #e9d6b0;   /* 종이 테두리 */
    --ink: #5a4130;    /* 글씨 (검정 X) */
    --muted: #a08a70;
    --pick: #ffe7a8;   /* 선택지 버튼 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--desk);
    color: var(--ink);
    font-family: "Galmuri11", "DungGeunMo", "Apple SD Gothic Neo", "Noto Sans KR", "맑은 고딕", "Malgun Gothic", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 16px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #book {
    position: relative;
    width: 100%;
    max-width: 720px;
    height: fit-content;
    background: var(--paper);
    border: 3px solid var(--edge);
    border-radius: 6px;
    box-shadow: 0 6px 0 var(--edge);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
  }
  #chapter { color: var(--muted); font-size: 14px; min-height: 18px; }
  #game {
    display: block;
    width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 3px solid var(--ink);
    border-radius: 2px;
  }
  #say {
    min-height: 92px;
    font-size: 17px;
    line-height: 1.7;
    padding: 4px 6px;
    white-space: pre-line;
    transition: filter 1.2s, opacity 1.2s;
  }
  /* 배드엔딩: 글씨도 지우개로 지운 것처럼 번진다 */
  #say.erased { filter: blur(3px); opacity: .3; }
  #hint {
    color: var(--muted);
    font-size: 14px;
    text-align: right;
    min-height: 20px;
    animation: blink 1.2s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: .35; } }
  /* 버튼이 없어도 자리를 비워 둔다 — 버튼이 나올 때 책 크기가 바뀌지 않게 */
  #choices {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-content: center;
    min-height: 51px;
  }
  #choices button {
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--pick);
    border: 3px solid var(--ink);
    border-radius: 4px;
    padding: 10px 16px;
    box-shadow: 0 3px 0 var(--ink);
    cursor: pointer;
  }
  #choices button:active { transform: translateY(3px); box-shadow: none; }
  /* 장면 넘어갈 때 책 한 장이 하얘진다 */
  #fade {
    position: absolute;
    inset: 0;
    background: #fff;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .6s;
  }
  #fade.on { opacity: 1; }
  /* 좁은 화면은 긴 선택지가 두 줄로 내려가서 두 줄 자리를 비워 둔다 */
  @media (max-width: 480px) {
    #say { font-size: 15px; }
    #choices { min-height: 112px; }
  }
</style>
</head>
<body>
<main id="book">
  <div id="chapter"></div>
  <canvas id="game" width="160" height="90"></canvas>
  <div id="say"></div>
  <div id="choices"></div>
  <div id="hint"></div>
  <div id="fade"></div>
</main>
<script>
// ─────────────────────────────────────────────
// 1. 도트 데이터 (팔레트 + 격자)
//    '.' = 투명. 나머지 글자는 PALETTE 의 키.
// ─────────────────────────────────────────────
const W = 160, H = 90;
const FEET = 86;   // 소녀 발 높이 (길 위)

const PALETTE = {
  o: '#4a3428', // 외곽선 (검정 대신 진한 갈색)
  h: '#5a3a2a', // 머리카락
  s: '#f8cfab', // 피부
  c: '#f4a3a0', // 볼
  e: '#3a2a22', // 눈
  m: '#c9645a', // 입 · 교복 넥타이
  t: '#ff9e7a', // 윗옷
  p: '#7a8fd6', // 바지 · 치마
  b: '#7a5a44', // 신발
};

// 소녀 16x24 — 머리 큰 동글동글 비율. 시기마다 colors 로 머리·옷만 바꾼다
const GIRL_TOP = [
  '................',
  '.....oooooo.....',
  '...oohhhhhhoo...',
  '..ohhhhhhhhhho..',
  '.ohhhhhhhhhhhho.',
  '.ohhhhhhhhhhhho.',
  '.ohhhhsshhsshho.',
  '.ohhhssssssssso.',
  '.ohhsssesssesso.',
  '.ohhsssesssesso.',
  '.ohhsccssmsscco.',
  '..ohssssssssso..',
  '...ooossssooo...',
  '....otttttto....',
  '...otttttttto...',
  '..osttttttttso..',
  '..osttttttttso..',
  '...oppppppppo...',
  '....oppppppo....',
  '....opppoppo....',
];
// 학창 시절 16x26 — 같은 얼굴, 몸만 두 줄 길게 + 교복 넥타이(m)
const TEEN_TOP = [
  ...GIRL_TOP.slice(0, 13),
  '....ottmmtto....',
  '...otttmmttto...',
  '...otttttttto...',
  '..osttttttttso..',
  '..osttttttttso..',
  '..osttttttttso..',
  '...oppppppppo...',
  '...oppppppppo...',
  '....oppppppo....',
];
const LEGS_STAND = ['....oso..oso....', '....obo..obo....', '....obbo.obbo...', '................'];
const LEGS_A     = ['...oso....oso...', '...obo....obo...', '..obbo....obbo..', '................'];
const LEGS_B     = ['.....osooso.....', '.....oboobo.....', '.....obbobbo....', '................'];

const NOTE = [
  '..o..',
  '..oo.',
  '..o.o',
  '..o..',
  'ooo..',
  'ooo..',
];
// 걸으면서 외우는 글자
const LETTER = [
  '.ooo.',
  'o...o',
  'ooooo',
  'o...o',
  'o...o',
];

// 옷 색 — 같은 도트에 색만 바꾼다
const LOOKS = {
  sunny:   { h: '#d9873e', t: '#ffd35a', p: '#ffb347' },   // 써니 (엄마 본명에서 딴 이름), 해님 색
  friendA: { h: '#3a2a22', t: '#8fd0ff', p: '#f7b6c8' },
  friendB: { h: '#6b4a3a', t: '#c6e88a', p: '#7a8fd6' },
  uniform: { t: '#fbfbf5', p: '#46598f' },                  // 교복: 흰 블라우스 + 남색 치마
  gym:     { t: '#fbfbf5', p: '#4a6fd6', m: '#4a6fd6' },    // 체육복
  rivalA:  { h: '#2e2018', t: '#ffe08a', p: '#4a6fd6', m: '#ffe08a' },
  rivalB:  { h: '#7a4a2a', t: '#bfe3ff', p: '#4a6fd6', m: '#bfe3ff' },
  teenHome:{ t: '#ffb7a0', m: '#ffb7a0', p: '#7a8fd6' },
  father:  { h: '#5e5650', t: '#f1ece0', p: '#e6dfcf', m: '#f1ece0', b: '#5e5650' },  // 훈장님: 흰 한복
  fatherDrunk: { h: '#5e5650', t: '#f1ece0', p: '#e6dfcf', m: '#f1ece0', b: '#5e5650', c: '#ff6b6b', s: '#f9c0a0' },
};

// ─────────────────────────────────────────────
// 2. 도트 → 오프스크린 캔버스 (한 번만 그려 둔다)
// ─────────────────────────────────────────────
function makeSprite(rows, colors = {}, flip = false) {
  const pal = { ...PALETTE, ...colors };
  const w = rows[0].length;
  rows.forEach((r, i) => { if (r.length !== w) console.warn('도트 줄 길이 다름', i, r); });
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = rows.length;
  const c = cv.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.' || !pal[ch]) return;
    c.fillStyle = pal[ch];
    c.fillRect(flip ? w - 1 - x : x, y, 1, 1);
  }));
  return cv;
}

// 서기 1장 + 걷기 2장, 좌우
const LEGS_16 = { stand: LEGS_STAND, a: LEGS_A, b: LEGS_B };

function makeWalker(top, colors = {}, legs = LEGS_16) {
  const frames = (flip) => ({
    stand: makeSprite([...top, ...legs.stand], colors, flip),
    walk: [makeSprite([...top, ...legs.a], colors, flip), makeSprite([...top, ...legs.b], colors, flip)],
  });
  return { right: frames(false), left: frames(true) };
}

// 어른 16x26 — 학창 시절과 같은 키, 머리가 어깨까지 내려온다
const ADULT_TOP = [
  ...GIRL_TOP.slice(0, 11),
  '.ohhsssssssshho.',
  '.ohhoossssoohho.',
  '.ohhottttttohho.',
  '..ohottttttoho..',
  '...otttttttto...',
  '..osttttttttso..',
  '..osttttttttso..',
  '..osttttttttso..',
  '...oppppppppo...',
  '...oppppppppo...',
  '....oppppppo....',
];

// 아이 10x14 — 첫째(아들) · 둘째(딸)
const KID_TOP = [
  '...oooo...',
  '.oohhhhoo.',
  'ohhhhhhhho',
  'ohhsshssho',
  'osesssseso',
  'oscsssscso',
  '.ossmmsso.',
  '..oooooo..',
  '..otttto..',
  '.osttttso.',
  '..otttto..',
  '..oppppo..',
];
const KID_LEGS = {
  stand: ['..obo.obo.', '..........'],
  a: ['.obo..obo.', '..........'],
  b: ['...obobo..', '..........'],
};

const HEART = [
  'oo.oo',
  'ooooo',
  'ooooo',
  '.ooo.',
  '..o..',
];

Object.assign(LOOKS, {
  worker:    { t: '#a9c4dc', p: '#6f84a8' },                         // 공장 작업복
  adult:     { t: '#ffb7a0', p: '#c98aa8' },
  adultDawn: { t: '#e9a35a', p: '#5a6a8a' },                         // 새벽 배달 잠바
  boy:       { h: '#2e2018', t: '#fbfbf5', p: '#5a6a8a', m: '#fbfbf5' },   // 아빠 (흰 셔츠)
  boyWorker: { h: '#2e2018', t: '#a9c4dc', p: '#6f84a8', m: '#a9c4dc' },
  suitorA:   { h: '#5a4a3a', t: '#a9c4dc', p: '#6f84a8', m: '#a9c4dc' },
  suitorB:   { h: '#2e2018', t: '#c6b5e0', p: '#6f84a8', m: '#c6b5e0' },
  son:       { t: '#7cc56b', p: '#5a6a8a' },
  daughter:  { t: '#f7b6c8', p: '#f27a9b' },
  grandma:   { h: '#cfc9c4', t: '#b48aac', p: '#8a7a9a', m: '#b48aac' },  // 소녀의 어머니 (흰머리)
  momA:      { h: '#2e2018', t: '#bfe3ff', p: '#7a8fd6' },
  momB:      { h: '#7a4a2a', t: '#c6e88a', p: '#5a6a8a' },
  sonAdult:  { h: '#2e2018', t: '#7cc56b', p: '#5a6a8a', m: '#7cc56b' },
  daughterAdult: { h: '#3a2a22', t: '#f7b6c8', p: '#7a8fd6' },
});

const SPRITES = {
  girl: makeWalker(GIRL_TOP),
  sunny: makeWalker(GIRL_TOP, LOOKS.sunny),
  friendA: makeWalker(GIRL_TOP, LOOKS.friendA),
  friendB: makeWalker(GIRL_TOP, LOOKS.friendB),
  teen: makeWalker(TEEN_TOP, LOOKS.uniform),
  teenGym: makeWalker(TEEN_TOP, LOOKS.gym),
  teenHome: makeWalker(TEEN_TOP, LOOKS.teenHome),
  rivalA: makeWalker(TEEN_TOP, LOOKS.rivalA),
  rivalB: makeWalker(TEEN_TOP, LOOKS.rivalB),
  father: makeWalker(TEEN_TOP, LOOKS.father),
  fatherDrunk: makeWalker(TEEN_TOP, LOOKS.fatherDrunk),
  worker: makeWalker(ADULT_TOP, LOOKS.worker),
  adult: makeWalker(ADULT_TOP, LOOKS.adult),
  adultDawn: makeWalker(ADULT_TOP, LOOKS.adultDawn),
  boy: makeWalker(TEEN_TOP, LOOKS.boy),
  boyWorker: makeWalker(TEEN_TOP, LOOKS.boyWorker),
  suitorA: makeWalker(TEEN_TOP, LOOKS.suitorA),
  suitorB: makeWalker(TEEN_TOP, LOOKS.suitorB),
  son: makeWalker(KID_TOP, LOOKS.son, KID_LEGS),
  daughter: makeWalker(KID_TOP, LOOKS.daughter, KID_LEGS),
  note: makeSprite(NOTE, { o: '#f27a9b' }),
  letter: makeSprite(LETTER, { o: '#5a8fd6' }),
  heart: makeSprite(HEART, { o: '#ff7a9b' }),
  grandma: makeWalker(TEEN_TOP, LOOKS.grandma),
  momA: makeWalker(ADULT_TOP, LOOKS.momA),
  momB: makeWalker(ADULT_TOP, LOOKS.momB),
  sonAdult: makeWalker(TEEN_TOP, LOOKS.sonAdult),
  daughterAdult: makeWalker(ADULT_TOP, LOOKS.daughterAdult),
};

// ─────────────────────────────────────────────
// 3. 배경 — 시기별 하늘 (문서 game/01-엄마-이야기.md 의 '그림 방향')
// ─────────────────────────────────────────────
const ERA = {
  spring: {   // 어린 시절: 봄 아침, 연두 논밭
    sky: ['#c4ebff', '#d8f3ff', '#ecfaff'],
    sun: ['#fff1a8', '#ffe066'], sunX: 30,
    hill: ['#b8e09a', '#9ad27c'],
    soil: '#d9b27a', furrow: '#c49a63', sprout: '#7cc56b', path: '#ecd6a4',
  },
  summer: {   // 학창 시절: 여름 낮, 파란 하늘
    sky: ['#7fcbff', '#9cd8ff', '#bfe7ff'],
    sun: ['#fff3b0', '#ffd84a'], sunX: 132,
    hill: ['#8fd06a', '#6fbf55'],
    soil: '#e3c48e', furrow: '#cfa970', sprout: '#5fb04a', path: '#ecd6a4',
  },
  sunset: {   // 어른: 노을 저녁, 주황 · 분홍
    sky: ['#ffa98a', '#ffc29e', '#ffdcb8'], cloud: '#ffeadf',
    sun: ['#fff0c0', '#ffcf70'], sunX: 34, sunY: 46,
    hill: ['#d9a7bf', '#c693ae'], path: '#ecd9c8', furrow: '#d8c0ae',
  },
  dusk: {     // 기숙사 앞: 해 진 직후 보라 → 분홍
    sky: ['#8f86c4', '#b896c6', '#f0b4ae'], cloud: '#e6d2e6',
    hill: ['#a98fb8', '#9580a8'], path: '#e3d3cf', furrow: '#cdb9b8',
  },
  dawn: {     // 새벽 배달: 남색이지만 가로등 · 창문 불빛은 노랗게
    sky: ['#34406e', '#4a578c', '#7a80b4'], cloud: '#5f6a9c',
    hill: ['#4e5a86', '#434e78'], path: '#9aa0bf', furrow: '#858bab',
  },
  morning: {  // 배달 끝나고 돌아올 때: 해 뜨는 아침
    sky: ['#9cc4ee', '#f7c6a8', '#ffe3b0'],
    sun: ['#fff0c0', '#ffd36a'], sunX: 140, sunY: 50,
    hill: ['#9fbf9a', '#8cae88'], path: '#ecd9c8', furrow: '#d8c0ae',
  },
  rain: {     // 아버지 돌아가신 날: 비 오는 저녁. 슬프지만 까맣지 않게 (연보라 회색)
    sky: ['#a3abcf', '#b6bbd8', '#cbcbe0'],
    hill: ['#a9bba3', '#93a98e'],
    soil: '#c4b597', furrow: '#ad9f84', path: '#d3c6aa',
  },
};

const PAPER = '#fff8ea';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function disc(cx, cy, r, color) {
  ctx.fillStyle = color;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r) ctx.fillRect(cx + dx, cy + dy, 1, 1);
}

// 띠 경계를 체크무늬로 섞어 도트답게
function skyBands(colors, bottom) {
  const step = bottom / colors.length;
  colors.forEach((col, i) => rect(0, i * step, W, step + 1, col));
  for (let i = 1; i < colors.length; i++) {
    const y = Math.round(i * step);
    ctx.fillStyle = colors[i - 1];
    for (let x = 0; x < W; x += 2) ctx.fillRect(x + (y % 2), y, 1, 1);
  }
}

function drawSun(era, t) {
  const y = era.sunY || 14;
  disc(era.sunX, y, 7 + (Math.floor(t / 40) % 2), era.sun[0]);
  disc(era.sunX, y, 5, era.sun[1]);
}

function drawCloud(x, y, color = '#ffffff') {
  x = ((x % (W + 40)) + W + 40) % (W + 40) - 30;
  rect(x + 4, y, 12, 3, color);
  rect(x, y + 3, 22, 4, color);
}

function drawHills(era) {
  for (let x = 0; x < W; x++) {
    const a = Math.round(46 + 4 * Math.sin(x / 14) + 2 * Math.sin(x / 5));
    rect(x, a, 1, 60 - a, era.hill[0]);
    const b = Math.round(53 + 3 * Math.sin(x / 9 + 1));
    rect(x, b, 1, 60 - b, era.hill[1]);
  }
}

function drawSky(era, t) {
  skyBands(era.sky, 60);
  if (era.sun) drawSun(era, t);
  drawCloud(t / 12 + 20, 10, era.cloud);
  drawCloud(t / 18 + 110, 20, era.cloud);
  drawHills(era);
}

function drawField(era, t) {
  rect(0, 58, W, H - 58, era.soil);
  for (let y = 60; y < 74; y += 4) {
    rect(0, y, W, 1, era.furrow);
    for (let x = (y % 8); x < W; x += 6) {
      const sway = Math.floor(t / 30 + x) % 2;
      rect(x, y - 1, 1, 1, era.sprout);
      rect(x + sway, y - 2, 1, 1, era.sprout);
    }
  }
  drawPath(era);
}

function drawPath(era) {
  rect(0, 76, W, H - 76, era.path);              // 맨 아래까지 칠해야 지난 프레임이 안 남는다
  rect(0, 76, W, 1, era.furrow);
}

// 초가집. mode: tv = 캔디캔디 나오는 창문 / lit = 따뜻한 불빛 / rain = 비 오는 날 (색이 가라앉음)
const HOUSE = { x: 100, window: { x: 110, y: 46 }, door: 134 };
function drawHouse(t, mode = 'tv') {
  const x = HOUSE.x;
  const wall = mode === 'rain' ? '#e6d7b9' : '#f5e2bc';
  const roof = mode === 'rain' ? '#cfb575' : '#e3bf6a';
  rect(x + 2, 42, 46, 24, PALETTE.o);
  rect(x + 3, 43, 44, 23, wall);
  for (let i = 0; i < 14; i++) {                 // 지붕 (초가)
    rect(x - 4 + i, 28 + 14 - i, 58 - i * 2, 1, i === 13 ? PALETTE.o : roof);
  }
  rect(x - 4, 41, 58, 2, PALETTE.o);
  for (let i = 0; i < 6; i++) rect(x + 2 + i * 9, 32 + (i % 2) * 3, 1, 6, '#c9a050');
  const w = HOUSE.window;
  rect(w.x - 1, w.y - 1, 18, 12, PALETTE.o);
  if (mode === 'tv') {                           // TV 불빛 + 여동생 · 어린 조카 뒤통수
    rect(w.x, w.y, 16, 10, Math.floor(t / 25) % 2 ? '#a8dcff' : '#c6e8ff');
    rect(w.x + 3, w.y + 6, 4, 4, PALETTE.h);
    rect(w.x + 9, w.y + 7, 3, 3, '#6b4a3a');
  } else {
    rect(w.x, w.y, 16, 10, '#ffe6a0');
  }
  rect(w.x + 7, w.y, 1, 10, PALETTE.o);
  rect(HOUSE.door - 1, 49, 10, 17, PALETTE.o);   // 문
  rect(HOUSE.door, 50, 8, 16, '#a8714a');
  rect(HOUSE.door + 6, 58, 1, 1, '#ffe066');
}

// 볏단 — 지게 장면에서 소녀가 숨는 곳. 소녀보다 앞에 그린다 (머리만 빼꼼)
const HAY = { x: 96, w: 24, top: 68 };
function drawHay(x = HAY.x, top = HAY.top, w = HAY.w) {
  const half = w / 2, cx = x + half, h = FEET + 1 - top;
  const dome = Math.min(half, h * 0.6);           // 위쪽은 둥글게, 아래는 곧게
  for (let y = top; y <= FEET; y++) {
    const d = y - top;
    const k = d < dome ? Math.max(2, Math.round(half * Math.sqrt(1 - ((dome - d) / dome) ** 2))) : half;
    rect(cx - k - 1, y, k * 2 + 2, 1, PALETTE.o);
    rect(cx - k, y, k * 2, 1, (y - top) % 4 === 2 ? '#c9a040' : '#e8c25a');
  }
  rect(cx - half, top + Math.round(h * 0.55), w, 2, '#a8803a');   // 묶은 끈
}

  const C = {
    eve:     { wall: '#f2e2d4', door: '#a8714a', off: '#c9b0a8', end: '#b49a96', rail: '#e0cfc0' },
    dawn:    { wall: '#8d92b8', door: '#5e5878', off: '#4a5578', end: '#2f3558', rail: '#7a7fa6' },

  rect(x - 2, 44, 6, 3, '#6b6f8a');

// ─────────────────────────────────────────────
// 5. 진행 — 누르기(또는 스페이스바) 하나로 다 한다 (글 넘기기 · 걷기)
//    배드엔딩 뒤에는 그 장면부터 다시 (문서의 '정한 것')
// ─────────────────────────────────────────────
const sayEl = document.getElementById('say');
const hintEl = document.getElementById('hint');
const choicesEl = document.getElementById('choices');
const chapterEl = document.getElementById('chapter');

const S = {};          // 지금 장면 상태
let waitClick = null;  // 다음에 누르면 할 일
let typing = null;
let typeTimer = null;
let queue = [];
let afterLines = null;

const hint = (text) => { hintEl.textContent = text; };

function say(lines, done) {
  queue = [...lines];
  afterLines = done;
  nextLine();
}

function nextLine() {
  if (!queue.length) {
    const f = afterLines;
    afterLines = null;
    if (f) f();
    return;
  }
  const line = queue.shift();
  const text = typeof line === 'string' ? line : line.text;
  if (line.on) line.on();
  hint('');
  let i = 0;
  typing = text;
  sayEl.textContent = '';
  clearInterval(typeTimer);
  typeTimer = setInterval(() => {
    i++;
    sayEl.textContent = text.slice(0, i);
    if (i >= text.length) finishTyping();
  }, 45);
}

function finishTyping() {
  clearInterval(typeTimer);
  sayEl.textContent = typing;
  typing = null;
  hint('▼');
  waitClick = nextLine;
}

function advance() {
  if (fading) return;
  if (typing) { finishTyping(); return; }
  if (waitClick) {
    const f = waitClick;
    waitClick = null;
    f();
  }
}

document.getElementById('book').addEventListener('click', advance);

// 스페이스바 = 누르기. 선택지는 고르는 거라 스페이스로 안 넘어간다 (마우스·터치로 고른다)
document.addEventListener('keydown', (ev) => {
  if (ev.code !== 'Space') return;
  ev.preventDefault();   // 화면 스크롤 · 포커스된 버튼 눌림 막기
  if (!ev.repeat) advance();
});

// 다음 장면으로 넘어갈 때: 하얘졌다가 → 장면 바꾸고 → 다시 밝아진다
const FADE_MS = 600;
const fadeEl = document.getElementById('fade');
let fading = false;
function fadeTo(fn) {
  fading = true;
  hint('');
  fadeEl.classList.add('on');
  setTimeout(() => {
    fn();
    fadeEl.classList.remove('on');
    setTimeout(() => { fading = false; }, FADE_MS);
  }, FADE_MS + 200);
}

function walkTo(x, done, speed = 0.6) {
  S.target = x;
  S.arrive = done;
  S.speed = speed;
  S.working = false;
}

function startScene(i) {
  const sc = SCENES[i];
  if (!sc) { showEnd(); return; }
  Object.assign(S, {
    scene: i, sc, x: sc.startX, target: null, arrive: null, speed: 0.6, step: 0, dir: 'right',
    working: false, carry: null, music: false, hum: false, study: false, tear: false, clear: false,
    pour: 0, hidden: false, sparkle: false, eraseAt: null, actors: [], parts: [],
    look: null, bg: null, flashAt: null, love: false, party: false, rain: false, morning: false, shine: false,
    bell: false, gloom: false, shake: 0, fire: false, smoke: false, kidsIn: 0, milkPile: 0,
    sign: false, cap: false, bookDone: false, feet: null, props: [],
  });
  if (sc.setup) sc.setup();
  chapterEl.textContent = sc.chapter;
  sayEl.classList.remove('erased');
  choicesEl.innerHTML = '';
  say(sc.intro || [], () => {
    if (sc.eventX == null) { runEvent(); return; }
    hint('화면을 누르면 걸어가요 ▶');
    S.sparkle = true;
    waitClick = () => { S.sparkle = false; walkTo(sc.eventX, runEvent); };
  });
}

// 장면 안에서 배경이 바뀔 때 (미용실 → 아파트 → 새벽) 화면이 잠깐 하얗게 번쩍
function setBg(name) {
  S.bg = name;
  S.flashAt = performance.now();
}

function runEvent() {
  // 선택지 없는 장면(돌아보기 · 엔딩)은 글이 끝나면 바로 다음 장면으로
  say(S.sc.event || [], S.sc.choices ? showChoices : sceneClear);
}

function showChoices() {
  hint('');
  S.sc.choices.forEach((ch) => {
    const btn = document.createElement('button');
    btn.textContent = ch.label;
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      choicesEl.innerHTML = '';
      pick(ch);
    });
    choicesEl.appendChild(btn);
  });
}

function pick(ch) {
  const go = () => say(ch.lines, () => (ch.ok ? sceneClear() : badEnding()));
  if (ch.before) ch.before(go);
  else if (ch.walkTo != null) walkTo(ch.walkTo, () => { S.hidden = true; go(); });
  else go();
}

function sceneClear() {
  hint('다음 장면 ▶');
  waitClick = () => {
    const next = () => fadeTo(() => startScene(S.scene + 1));
    if ((S.bg || S.sc.bg) === 'intro') { next(); return; }
    walkTo(W + 4, next, Math.max(S.speed, 0.6));   // 오른쪽으로 걸어 나간 뒤 하얘진다
  };
}

// 화면을 까맣게 하지 않는다 — 지우개로 지우듯 그림·글씨가 번진다
function badEnding() {
  hint('');
  S.eraseAt = performance.now();
  setTimeout(() => sayEl.classList.add('erased'), 300);
  setTimeout(() => {
    const btn = document.createElement('button');
    btn.textContent = '이 장면 다시 읽기';
    btn.addEventListener('click', (ev) => { ev.stopPropagation(); startScene(S.scene); });
    choicesEl.appendChild(btn);
  }, 1600);
}

function showEnd() {
  Object.assign(S, {
    sc: { bg: 'intro' }, x: -99, target: null, actors: [], parts: [],
    music: false, hum: false, study: false, eraseAt: null, hidden: true,
    look: null, bg: null, flashAt: null, love: false, party: false, rain: false, morning: false, shine: false,
    bell: false, gloom: false, shake: 0, fire: false, smoke: false, kidsIn: 0, milkPile: 0,
    sign: false, cap: false, bookDone: false, feet: null, props: [],
  });
  chapterEl.textContent = '';
  S.bookDone = true;   // 다 읽었으니 책의 지워진 줄이 채워져 있다
  say(['- 끝 -'], () => {
    hint('처음부터 ▶');
    waitClick = () => fadeTo(() => startScene(0));
  });
}

// ─────────────────────────────────────────────
// 6. 움직임 · 그리기
// ─────────────────────────────────────────────
const ERASE_CELL = 4;
const ERASE_RAND = Array.from({ length: (W / ERASE_CELL) * Math.ceil(H / ERASE_CELL) }, Math.random);
const CONFETTI = ['#ff7a7a', '#ffd35a', '#7cc56b', '#5a8fd6', '#f27a9b', '#ffffff'];

// 소녀 · 등장인물 공통: target 까지 speed 로 걷고, 도착하면 arrive()
function moveToward(o) {
  if (o.target == null) return;
  const d = o.target - o.x;
  o.dir = d < 0 ? 'left' : 'right';
  o.x += Math.sign(d) * Math.min(Math.abs(d), o.speed || 0.6);
  o.step = (o.step || 0) + 1;
  if (Math.abs(o.target - o.x) < 0.01) {
    o.x = o.target;
    o.target = null;
    const f = o.arrive;
    o.arrive = null;
    if (f) f();
  }
}

function girlSprite() {
  return SPRITES[S.look || S.sc.actor][S.dir || 'right'];
}

function burst(n) {
  for (let i = 0; i < n; i++) {
    S.parts.push({ kind: 'confetti', x: Math.random() * W, y: -Math.random() * 30, vx: (Math.random() - 0.5) * 0.4, vy: 0.4 + Math.random() * 0.5, life: 200, color: CONFETTI[i % CONFETTI.length] });
  }
}

function update(t) {
  moveToward(S);
  // follow: 소녀와 그만큼 떨어져서 따라 걷는다 (남편 · 아이들)
  S.actors.forEach((a) => {
    if (a.follow == null) return;
    const tx = S.x + a.follow;
    if (Math.abs(tx - a.x) > 1) { a.target = tx; a.speed = Math.max(S.speed || 0.6, 0.6); }
    else { a.target = null; a.dir = S.dir; }
  });
  S.actors.forEach(moveToward);
  const headY = S.sc.actor ? (S.feet || S.sc.feet || FEET) - girlSprite().stand.height - 2 : 0;
  if (S.shake > 0) S.shake--;
  // 음표: 창문에서, 흥얼거릴 때는 소녀 머리에서 / 공부할 때는 글자
  if (S.music && S.sc.noteFrom && t % 40 === 0) S.parts.push({ kind: 'note', x: S.sc.noteFrom.x, y: S.sc.noteFrom.y, life: 120 });
  if (S.hum && !S.hidden && t % 55 === 0) S.parts.push({ kind: 'note', x: S.x + 12, y: headY, life: 120 });
  if (S.study && t % 35 === 0) S.parts.push({ kind: 'letter', x: S.x + 10, y: headY, life: 100 });
  if (S.love && !S.hidden && t % 30 === 0) S.parts.push({ kind: 'heart', x: S.x + 4 + Math.random() * 10, y: headY, life: 110 });
  S.actors.forEach((a) => {
    if (a.heart && t % 45 === 0) S.parts.push({ kind: 'heart', x: a.x + 6, y: a.feet - 30, life: 90 });
  });
  if (S.pour > 0) {   // 주전자에 몰래 물 타기
    S.pour--;
    if (S.pour % 4 === 0) S.parts.push({ kind: 'drop', x: S.x + 14 + Math.random() * 3, y: FEET - 22, vy: 0.5, life: 22 });
  }
  S.parts.forEach((p) => {
    p.age = (p.age || 0) + 1;
    if (p.kind === 'note' || p.kind === 'letter' || p.kind === 'heart') { p.y -= 0.25; p.x += Math.sin(p.age / 10) * 0.3; }
    else { p.x += p.vx || 0; p.y += p.vy || 0; }
  });
  S.parts = S.parts.filter((p) => p.age < p.life && p.y < H + 4);
}

function drawActor(a, t) {
  if (a.kind === 'bus') { drawBus(a.x); return; }
  const frames = SPRITES[a.sprite][a.dir || 'right'];
  const img = a.target != null ? frames.walk[Math.floor(a.step / (a.speed > 1 ? 5 : 10)) % 2] : frames.stand;
  const x = Math.round(a.x), y = a.feet - (img.height - 1);
  ctx.drawImage(img, x, y);
  if (a.hat) {   // 훈장님 갓 + 흰 수염
    rect(x - 1, y + 2, 18, 1, '#2e2622');
    rect(x + 4, y - 2, 8, 4, '#2e2622');
    rect(x + 6, y + 12, 4, 3, '#f4f1ea');
  }
  if (a.bundle) {   // 복숭아 보따리
    rect(x + 12, y + 14, 8, 7, PALETTE.o);
    rect(x + 13, y + 15, 6, 5, '#f7a8c0');
    rect(x + 15, y + 13, 2, 2, '#f7a8c0');
    rect(x + 14, y + 16, 2, 2, '#ffb38a');
  }
  if (a.jug) {      // 어깨에 멘 생수통
    rect(x + 1, y - 6, 8, 10, PALETTE.o);
    rect(x + 2, y - 5, 6, 8, '#9cd3f5');
    rect(x + 4, y - 7, 2, 2, '#5a8fd6');
  }
  if (a.bandage) rect(x + 2, y + 4, 12, 2, '#ffffff');
  if (a.dizzy) {    // 머리 위 빙글빙글 별
    const k = Math.floor(t / 8) % 4;
    const pts = [[0, -3], [14, -1], [12, -6], [2, -6]];
    rect(x + pts[k][0], y + pts[k][1], 2, 2, '#ffd35a');
    rect(x + pts[(k + 2) % 4][0], y + pts[(k + 2) % 4][1], 2, 2, '#ffd35a');
  }
  if (a.device) {   // 영어공부기기
    rect(x + 7, a.feet - 6, 5, 4, PALETTE.o);
    rect(x + 8, a.feet - 5, 3, 2, '#ffd35a');
  }
}

function drawGirl(t) {
  const frames = girlSprite();
  const walking = S.target != null;
  const img = walking ? frames.walk[Math.floor(S.step / (S.speed > 1 ? 5 : 10)) % 2] : frames.stand;
  const bob = S.working && Math.floor(t / 20) % 2 ? 1 : 0;   // 호미질
  const x = Math.round(S.x);
  const y = (S.feet || S.sc.feet || FEET) - (img.height - 1) + bob;
  const hand = y + img.height - 9;
  const front = S.dir === 'left' ? -1 : 1;
  const hx = S.dir === 'left' ? x + 2 : x + 13;
  if (S.carry === 'jige') {                      // 지게 (등 뒤라 몸보다 먼저)
    const bx = S.dir === 'left' ? x + 9 : x - 3;
    rect(bx, y - 3, 10, 18, PALETTE.o);            // 짐 (볏짚 다발) — 머리 위로 삐죽
    rect(bx + 1, y - 2, 8, 16, '#e3bf6a');
    rect(bx + 1, y + 2, 8, 1, '#c9a050');
    rect(bx + 1, y + 8, 8, 1, '#c9a050');
    rect(bx + 2, y + 15, 1, 9, '#8a5a3c');         // 지게 다리
    rect(bx + 7, y + 15, 1, 9, '#8a5a3c');
  }
  ctx.drawImage(img, x, y);
  if (S.carry === 'hoe' && S.working) {
    rect(hx, y + 15, 1, 6, '#9a6a44');
    rect(hx - 1 + bob * front, y + 21, 3, 2, '#8a93a6');
  }
  if (S.carry === 'kettle') {
    rect(hx - 1, hand + 1, 5, 4, PALETTE.o);
    rect(hx, hand + 2, 3, 2, '#b9c2cc');
    rect(hx + (front > 0 ? 4 : -2), hand + 1, 1, 1, PALETTE.o);
  }
  if (S.carry === 'paper') {                     // 신문 뭉치
    rect(hx - 3, hand - 2, 7, 6, PALETTE.o);
    rect(hx - 2, hand - 1, 5, 4, '#f4f1ea');
    rect(hx - 2, hand, 5, 1, '#b8b4a8');
  }
  if (S.carry === 'milk') {                      // 우유 상자
    rect(hx - 4, hand - 3, 9, 7, PALETTE.o);
    rect(hx - 3, hand - 2, 7, 5, '#5a8fd6');
    for (let i = 0; i < 3; i++) rect(hx - 2 + i * 2, hand - 4, 1, 2, '#ffffff');
  }
  if (S.carry === 'lunch') {                     // 도시락 (보자기)
    rect(hx - 2, hand - 1, 6, 5, PALETTE.o);
    rect(hx - 1, hand, 4, 3, '#ff7a7a');
    rect(hx, hand - 2, 2, 1, '#ff7a7a');
  }
  if (S.carry === 'cert') {                      // 표창장
    rect(hx - 2, hand - 4, 6, 8, PALETTE.o);
    rect(hx - 1, hand - 3, 4, 6, '#fffaf0');
    rect(hx, hand + 1, 2, 2, '#e6b422');
  }
  if (S.cap) {                                   // 학사모
    rect(x + 1, y + 1, 14, 2, '#2e2622');
    rect(x + 5, y - 1, 6, 2, '#2e2622');
    rect(x + 13, y + 3, 1, 4, '#ffd35a');
  }
  if (S.carry === 'book') {
    rect(hx - 1, hand - 1, 4, 5, PALETTE.o);
    rect(hx, hand, 2, 3, '#5a8fd6');
  }
  if (S.tear && Math.floor(t / 30) % 3 !== 0) {
    const tx = S.dir === 'left' ? x + 4 : x + 11;
    rect(tx, y + 10 + (Math.floor(t / 10) % 3), 1, 2, '#9cd3f5');
  }
}

function drawParts() {
  S.parts.forEach((p) => {
    if (p.kind === 'note' || p.kind === 'letter' || p.kind === 'heart') {
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.drawImage(SPRITES[p.kind], Math.round(p.x), Math.round(p.y));
    } else if (p.kind === 'confetti') {
      ctx.globalAlpha = 1;
      rect(p.x, p.y, 2, 1 + (Math.floor(p.age / 8) % 2), p.color);
    } else if (p.kind === 'drop') {
      ctx.globalAlpha = 1;
      rect(p.x, p.y, 1, 2, '#7fc8e8');
    }
  });
  ctx.globalAlpha = 1;
}

function draw(t, now) {
  const sc = S.sc;
  const bg = S.bg || sc.bg;
  ctx.save();
  if (S.shake > 0) ctx.translate(Math.round(Math.random() * 4 - 2), Math.round(Math.random() * 2 - 1));   // 쿵!
  BG[bg](t);
  if (S.milkPile) drawMilkPile(S.milkPile);
  S.props.forEach((pr) => {                      // 떨어진 생수통
    rect(pr.x, 80, 11, 6, PALETTE.o);
    rect(pr.x + 1, 81, 9, 4, '#9cd3f5');
  });
  if (S.bell) { drawSparkle(27, 52, t); drawSparkle(33, 46, t + 15); }   // 띵동

  S.actors.filter((a) => a.layer !== 'front').forEach((a) => drawActor(a, t));
  if (S.sparkle) drawSparkle(sc.eventX + 8, 52, t);
  if (S.shine) {                                 // 잘생겼네?? — 소년 옆에 반짝
    const boy = S.actors.find((a) => a.boy);
    if (boy) { drawSparkle(boy.x + 15, boy.feet - 26, t); drawSparkle(boy.x - 2, boy.feet - 16, t + 15); }
  }
  if (!S.hidden && sc.actor) drawGirl(t);
  if (FRONT[bg]) FRONT[bg](t);
  S.actors.filter((a) => a.layer === 'front').forEach((a) => drawActor(a, t));
  drawParts();
  if (S.party) drawParty(t);
  if (S.rain) drawRain(t);
  if (S.gloom) {                                 // 형편이 어려워짐: 화면이 흐려진다 (까맣게는 아니고)
    ctx.globalAlpha = 0.35;
    rect(0, 0, W, H, '#7a7f9a');
    ctx.globalAlpha = 1;
  }
  if (S.flashAt != null && now - S.flashAt < 500) {
    ctx.globalAlpha = 1 - (now - S.flashAt) / 500;
    rect(0, 0, W, H, '#ffffff');
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  if (S.eraseAt != null) {
    const p = Math.min(1, (now - S.eraseAt) / 1400) * 0.85;
    ctx.fillStyle = PAPER;
    const cols = W / ERASE_CELL;
    ERASE_RAND.forEach((r, i) => {
      if (r < p) ctx.fillRect((i % cols) * ERASE_CELL, Math.floor(i / cols) * ERASE_CELL, ERASE_CELL, ERASE_CELL);
    });
  }
}

let tick = 0;
function loop(now) {
  tick++;
  update(tick);
  draw(tick, now);
  requestAnimationFrame(loop);
}

startScene(0);
requestAnimationFrame(loop);
</script>
</body>
